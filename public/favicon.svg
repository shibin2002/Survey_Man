<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="14" fill="white"/>
  <!-- Compass from SURVEY MAN header logo -->
  <g transform="translate(32,32)">
    <!-- outer broken ring -->
    <circle cx="0" cy="0" r="19.5" fill="none" stroke="#355CFF" stroke-width="6" stroke-dasharray="24.5 7.2" stroke-dashoffset="4.5" stroke-linecap="butt"/>
    <!-- arrow tips N/E/S/W -->
    <path d="M 0 -32.5 L -7.8 -20.8 L 7.8 -20.8 Z" fill="#355CFF"/>
    <path d="M 32.5 0 L 20.8 -7.8 L 20.8 7.8 Z" fill="#355CFF"/>
    <path d="M 0 32.5 L -7.8 20.8 L 7.8 20.8 Z" fill="#355CFF"/>
    <path d="M -32.5 0 L -20.8 -7.8 L -20.8 7.8 Z" fill="#355CFF"/>
    <!-- inner needle -->
    <path d="M 0 -16.5 L -15 17.5 L 0 5.2 Z" fill="#1E3A8A" stroke="#355CFF" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M 0 -16.5 L 0 5.2 L 15 17.5 Z" fill="white" stroke="#355CFF" stroke-width="0.9" stroke-linejoin="round"/>
    <circle cx="0" cy="5.2" r="1.3" fill="#355CFF"/>
  </g>
</svg>
